[package]
name = "party-relay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Relay WebSocket auto-hospedable para Party Queue v2"
license = "MIT"

[lib]
name = "party_relay"
path = "src/lib.rs"

[[bin]]
name = "party-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.30"

[profile.release]
lto = "thin"
strip = true
