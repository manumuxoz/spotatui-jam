# Plantilla de nightly para spotatui-jam.
# Copiar a .github/workflows/nightly.yml.

name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [parse_sync_message, queue_action, apply_patch]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked
      - run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=3600
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  soak:
    name: Soak (1h, 8 guests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release --locked --bin party-sim -- --guests 8 --ops 100000 --duration 3600 --chaos

  load:
    name: Relay load (100 rooms)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * 1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start relay
        working-directory: worker-relay
        run: |
          npm ci
          npm install -g wait-on
          npx wrangler dev --local --port 8787 &
          wait-on http://127.0.0.1:8787/healthz --timeout 60000
      - name: k6 WebSocket load
        run: |
          docker run --rm --network host -i grafana/k6 run - < scripts/load-party.js

  upstream:
    name: Upstream sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/LargeModGames/spotatui.git
          git fetch upstream main
      - name: Dry-run rebase
        run: |
          git checkout -B rebase-check
          if ! git rebase upstream/main; then
            gh issue create \
              --title "Upstream rebase conflict $(date -u +%F)" \
              --body "El rebase automático contra LargeModGames/spotatui falló. Revisar manualmente." \
              --label "upstream,maintenance"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
